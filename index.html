<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NN Food & Spices — 100% Naturally Pure Spices</title>
<meta name="description" content="NN Food & Spices — a premium Flutter app for Nujju's Nest Spices Pvt. Ltd.">
<style>
  :root {
    --green: #5E9C2C;
    --green-dark: #3D6E18;
    --orange: #F36B21;
    --bg: #F7F7F5;
    --card: #FFFFFF;
    --text: #1A1A1A;
    --text-muted: #5B5B5B;
    --border: #E7E7E3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14140F; --card: #1E1E17; --text: #F2F2ED; --text-muted: #B9B9B0; --border: #33332A; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 560px;
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 44px clamp(24px, 6vw, 48px);
    box-shadow: 0 16px 40px rgba(0,0,0,0.10);
    text-align: center;
  }
  .mark {
    width: 84px; height: 84px;
    margin: 0 auto 20px;
    border-radius: 22px;
    background: linear-gradient(135deg, var(--green), var(--green-dark));
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 30px; letter-spacing: -1px;
    box-shadow: 0 10px 24px rgba(94,156,44,0.35);
  }
  h1 { margin: 0 0 6px; font-size: 26px; }
  .tagline { color: var(--orange); font-weight: 600; margin: 0 0 20px; font-size: 14px; letter-spacing: 0.03em; }
  p.desc { color: var(--text-muted); font-size: 15px; margin: 0 0 28px; }
  .links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .links a {
    display: inline-block;
    padding: 12px 22px;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
  }
  .links a.primary { background: var(--green); color: #fff; }
  .links a.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  footer { margin-top: 28px; font-size: 12.5px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">NN</div>
    <h1>NN Food &amp; Spices</h1>
    <p class="tagline">100% NATURALLY PURE SPICES</p>
    <p class="desc">
      A premium cross-platform Flutter app for Nujju's Nest Spices Pvt. Ltd. —
      built for Android, iOS, Windows, macOS, Linux and Web.
    </p>
    <div class="links">
      <a class="primary" href="privacy-policy.html">Privacy Policy</a>
      <a class="secondary" href="https://github.com/mohdsayeed1979/nnfoodsandspices">View on GitHub</a>
      <a class="secondary" href="https://nnfoodsandspices.com">Visit Website</a>
    </div>
    <footer>© 2026 Nujju's Nest Spices Pvt. Ltd.</footer>
  </div>
</body>
</html>
