name: nn_food_spices
description: "NN Food & Spices - Premium 100% Naturally Pure Spices"
publish_to: 'none'

version: 1.0.4+5

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Models / codegen
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.1.3

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.4

  # UI / UX
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  skeletonizer: ^1.4.2
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.1
  flutter_svg: ^2.0.17
  lottie: ^3.3.1
  photo_view: ^0.15.0
  flutter_rating_bar: ^4.0.1
  shimmer_animation: ^2.2.0
  animated_text_kit: ^4.2.2
  flutter_staggered_animations: ^1.1.1
  badges: ^3.1.2
  responsive_framework: ^1.5.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

  # Splash & Icons (dev tooling generates from these; runtime splash pkg optional)
  flutter_native_splash: ^2.4.4

  # Localization
  easy_localization: ^3.0.7
  intl: ^0.20.2

  # Backend — live catalog (reads products/categories from Supabase when
  # SUPABASE_URL + anon key are supplied via --dart-define)
  supabase_flutter: ^2.8.0

  # Firebase (ready; app must still build without config files present)
  firebase_core: ^3.10.1
  firebase_messaging: ^15.2.1
  firebase_analytics: ^11.4.1
  firebase_crashlytics: ^4.3.1

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Utilities
  equatable: ^2.0.7
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  package_info_plus: ^8.1.4
  device_info_plus: ^11.2.2
  logger: ^2.5.0
  uuid: ^4.5.1
  webview_flutter: ^4.10.0
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  mobile_scanner: ^6.0.7
  speech_to_text: ^7.0.0
  in_app_review: ^2.0.10
  flutter_slidable: ^3.1.2
  pull_to_refresh_flutter3: ^2.0.2
  visibility_detector: ^0.4.0+2
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Codegen
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.3

  # Icon / splash generation
  flutter_launcher_icons: ^0.14.2

  mockito: ^5.4.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/
    - assets/splash/
    - assets/lottie/
    - assets/translations/

  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#63BC35"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#5E9C2C"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash/splash_logo.png
  color_dark: "#1A1A1A"
  image_dark: assets/splash/splash_logo.png
  android_12:
    image: assets/splash/splash_logo_android12.png
    icon_background_color: "#FFFFFF"
    image_dark: assets/splash/splash_logo_android12.png
    icon_background_color_dark: "#1A1A1A"
  web: true
  android: true
  ios: true
